<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details Task</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-container {
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 320px;
            margin-bottom: 30px;
        }

        .form-container h3 {
            text-align: center;
            margin-top: 0;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }

        .form-group input,
        .form-group textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group textarea {
            resize: none;
            height: 90px;
        }

        .error {
            color: red;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .warning {
            color: orange;
            font-size: 12px;
            margin-top: 4px;
        }

        .counter {
            font-size: 12px;
            text-align: right;
            margin-top: 4px;
            color: #555;
        }

        .save-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            width: 100%;
            padding: 8px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        .save-btn:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        .save-btn:hover:not(:disabled) {
            background-color: #219653;
        }

        table {
            width: 100%;
            max-width: 700px;
            border-collapse: collapse;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px 12px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #eaeded;
            color: #333;
        }

        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h3>STUDENT FORM</h3>

        <form id="studentForm">

            <!-- NAME -->
            <div class="form-group">
                <label for="name">Name</label>

                <input type="text" id="name">

                <span id="nameError" class="error">
                    Name cannot be empty
                </span>
            </div>


            <!-- EMAIL -->
            <div class="form-group">
                <label for="email">Email</label>

                <input type="email" id="email">

                <span id="emailError" class="error">
                    Please enter a valid email address
                </span>
            </div>


            <!-- PASSWORD -->
            <div class="form-group">
                <label for="password">Password</label>

                <input type="password" id="password">

                <span id="passwordError" class="error">
                    Password must contain at least 6 characters
                </span>
            </div>


            <!-- BIO -->
            <div class="form-group">
                <label for="bio">Bio</label>

                <textarea id="bio" maxlength="200"></textarea>

                <div id="counter" class="counter">
                    0 / 200 characters
                </div>

                <span id="bioWarning" class="warning"></span>
            </div>


            <!-- SUBMIT -->
            <button type="submit" id="submitBtn" class="save-btn" disabled>
                Save
            </button>

        </form>

    </div>


    <!-- TABLE -->

    <table id="studentTable">

        <thead>
            <tr>
                <th>NAME</th>
                <th>EMAIL</th>
                <th>BIO</th>
                <th>ACTION</th>
            </tr>
        </thead>

        <tbody>
        </tbody>

    </table>


    <script>

        // Get elements

        const form = document.getElementById("studentForm");

        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const bioInput = document.getElementById("bio");

        const nameError = document.getElementById("nameError");
        const emailError = document.getElementById("emailError");
        const passwordError = document.getElementById("passwordError");

        const counter = document.getElementById("counter");
        const bioWarning = document.getElementById("bioWarning");

        const submitBtn = document.getElementById("submitBtn");

        const tableBody = document.querySelector("#studentTable tbody");


        // NAME VALIDATION

        nameInput.addEventListener("input", function () {

            if (nameInput.value.trim() === "") {

                nameError.style.display = "block";

            } else {

                nameError.style.display = "none";

            }

            checkFormValidity();

        });


        // EMAIL VALIDATION

        emailInput.addEventListener("input", function () {

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(emailInput.value)) {

                emailError.style.display = "block";

            } else {

                emailError.style.display = "none";

            }

            checkFormValidity();

        });


        // PASSWORD VALIDATION

        passwordInput.addEventListener("input", function () {

            if (passwordInput.value.length < 6) {

                passwordError.style.display = "block";

            } else {

                passwordError.style.display = "none";

            }

            checkFormValidity();

        });


        // BIO CHARACTER COUNTER

        bioInput.addEventListener("input", function () {

            const length = bioInput.value.length;

            counter.textContent =
                length + " / 200 characters";


            // Warning when close to the limit

            if (length >= 180) {

                bioWarning.textContent =
                    "You are close to the 200-character limit.";

            } else {

                bioWarning.textContent = "";

            }

            checkFormValidity();

        });


        // CHECK ALL FIELDS

        function checkFormValidity() {

            const nameValid =
                nameInput.value.trim() !== "";

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            const emailValid =
                emailPattern.test(emailInput.value);

            const passwordValid =
                passwordInput.value.length >= 6;

            const bioValid =
                bioInput.value.length <= 200;


            if (
                nameValid &&
                emailValid &&
                passwordValid &&
                bioValid
            ) {

                submitBtn.disabled = false;

            } else {

                submitBtn.disabled = true;

            }

        }


        // FORM SUBMIT

        form.addEventListener("submit", function (e) {

            e.preventDefault();


            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const bio = bioInput.value.trim();


            // Create table row

            const newRow = document.createElement("tr");

            newRow.innerHTML = `
                <td>${name}</td>
                <td>${email}</td>
                <td>${bio}</td>
                <td>
                    <button class="delete-btn"
                        onclick="deleteRow(this)">
                        Delete
                    </button>
                </td>
            `;


            tableBody.appendChild(newRow);


            // Reset form

            form.reset();


            // Reset messages

            nameError.style.display = "none";
            emailError.style.display = "none";
            passwordError.style.display = "none";

            counter.textContent = "0 / 200 characters";

            bioWarning.textContent = "";


            // Disable button again

            submitBtn.disabled = true;

        });


        // DELETE ROW

        function deleteRow(button) {

            const row = button.closest("tr");

            row.remove();

        }

    </script>

</body>

</html>
